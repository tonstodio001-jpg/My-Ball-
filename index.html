<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أخبار كرة القدم اليوم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff6a;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
            --header-bg: #1e1e1e;
            --text-light: #ccc;
            --error-color: #ff4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            line-height: 1.6;
        }
        
        header {
            background: var(--header-bg);
            text-align: center;
            padding: 20px;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(0, 255, 106, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        .nav-link:hover {
            background: rgba(0, 255, 106, 0.1);
        }
        
        .nav-link.active {
            background: var(--primary-color);
            color: black;
            font-weight: bold;
        }
        
        .filter-bar {
            text-align: center;
            margin: 20px 0;
            padding: 0 15px;
        }
        
        select, .live-btn {
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1em;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 5px;
            font-family: 'Cairo', sans-serif;
        }
        
        select:hover, .live-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 106, 0.5);
            transform: scale(1.05);
        }
        
        .live-btn {
            font-weight: bold;
        }
        
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        
        .news-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 106, 0.125);
            cursor: pointer;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .news-card.visible {
            transform: translateY(0);
            opacity: 1;
        }
        
        .news-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 106, 0.375);
        }
        
        .news-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .news-card:hover img {
            transform: scale(1.05);
        }
        
        .news-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .news-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary-color);
            line-height: 1.4;
        }
        
        .news-description {
            font-size: 0.95em;
            color: var(--text-light);
            margin-bottom: 10px;
            flex-grow: 1;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--primary-color);
            font-size: 1.2em;
            grid-column: 1 / -1;
        }
        
        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .error-message {
            text-align: center;
            padding: 40px;
            color: var(--error-color);
            grid-column: 1 / -1;
        }
        
        .retry-btn {
            background: var(--primary-color);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            color: #888;
            border-top: 1px solid #222;
            margin-top: 30px;
            font-size: 0.9em;
        }
        
        /* تحسينات للجوال */
        @media (max-width: 768px) {
            .news-container {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 15px;
            }
            
            header {
                font-size: 1.4em;
                padding: 15px;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .nav-links {
                gap: 10px;
            }
            
            .filter-bar {
                margin: 15px 0;
            }
            
            select, .live-btn {
                width: 90%;
                margin: 5px 0;
                display: block;
            }
            
            .news-card img {
                height: 160px;
            }
        }
        
        @media (max-width: 480px) {
            header {
                font-size: 1.2em;
            }
            
            .news-title {
                font-size: 1em;
            }
            
            .news-description {
                font-size: 0.9em;
            }
            
            .nav-link {
                padding: 6px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">📰 أخبار كرة القدم</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">🏠 الأخبار</a>
                <a href="live-matches.html" class="nav-link">🔴 المباريات</a>
                <a href="article.html" class="nav-link">📄 المقالات</a>
            </div>
        </div>
    </header>

    <div class="filter-bar">
        <label for="league">اختر الدوري:</label>
        <select id="league">
            <option value="كرة القدم">الكل 🌍</option>
            <option value="الدوري الإسباني">🇪🇸 الدوري الإسباني</option>
            <option value="الدوري الإنجليزي">🏴 الدوري الإنجليزي</option>
            <option value="الدوري السعودي">🇸🇦 الدوري السعودي</option>
            <option value="الكرة الجزائرية">🇩🇿 الكرة الجزائرية</option>
        </select>
        <button class="live-btn" onclick="window.location.href='live-matches.html'">🔴 المباريات الحية</button>
    </div>

    <div id="news" class="news-container">
        <div class="loading">جارٍ تحميل الأخبار</div>
    </div>

    <footer>© 2025 موقع أخبار الكرة - يتم التحديث تلقائيًا ⚽</footer>

    <script>
        // مفتاح API حقيقي من GNews.io
        const apiKey = "ee17100f871cf86008ea6246193cc4ea";
        
        // بيانات احتياطية في حالة فشل API
        const backupNews = [
            {
                title: "أخبار كرة القدم المباشرة",
                description: "تابع آخر أخبار كرة القدم من مختلف الدوريات حول العالم",
                image: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80",
                publishedAt: new Date().toISOString(),
                source: { name: "موقع أخبار الكرة" },
                url: "article.html"
            }
        ];

        async function fetchNews(topic = "كرة القدم") {
            const container = document.getElementById("news");
            container.innerHTML = '<div class="loading">جارٍ تحميل الأخبار</div>';

            try {
                let query = topic;
                
                // تحسين استعلامات البحث لكل دوري
                if (topic === "الكرة الجزائرية") {
                    query = "كرة القدم الجزائر OR الدوري الجزائري OR المنتخب الجزائري";
                } else if (topic === "الدوري السعودي") {
                    query = "الدوري السعودي OR دوري المحترفين السعودي";
                } else if (topic === "الدوري الإنجليزي") {
                    query = "الدوري الإنجليزي الممتاز OR Premier League";
                } else if (topic === "الدوري الإسباني") {
                    query = "الدوري الإسباني OR La Liga";
                }
                
                const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(query)}&lang=ar&token=${apiKey}&max=12`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`خطأ في الشبكة: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.articles && data.articles.length > 0) {
                    displayNews(data.articles);
                } else {
                    // إذا لم توجد أخبار، استخدم البيانات الاحتياطية
                    console.warn('لم يتم العثور على أخبار، استخدام البيانات الاحتياطية');
                    displayNews(backupNews);
                }
                
            } catch (error) {
                console.error('تفاصيل الخطأ:', error);
                // في حالة الخطأ، استخدم البيانات الاحتياطية
                displayNews(backupNews);
                
                container.innerHTML += `
                    <div class="error-message">
                        <p>⚠️ تم تحميل أخبار تجريبية بسبب مشكلة في الاتصال</p>
                        <button class="retry-btn" onclick="fetchNews('${topic}')">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function displayNews(articles) {
            const container = document.getElementById("news");
            container.innerHTML = "";
            
            articles.forEach((article, index) => {
                const card = document.createElement("div");
                card.className = "news-card";
                
                // تنسيق التاريخ
                const publishDate = new Date(article.publishedAt);
                const formattedDate = publishDate.toLocaleDateString('ar-AR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                // معالجة الصور - استخدام صورة افتراضية إذا لم تكن موجودة
                const imageUrl = article.image || 
                    'https://images.unsplash.com/photo-1574629810360-7efbbe195018?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80';
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${article.title}" 
                         onerror="this.src='https://images.unsplash.com/photo-1574629810360-7efbbe195018?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'">
                    <div class="news-content">
                        <div class="news-title">${article.title}</div>
                        <div class="news-description">${article.description || "لا يوجد وصف متاح لهذا الخبر"}</div>
                        <div class="news-meta">
                            <span>${article.source.name || "مصدر غير معروف"}</span>
                            <span>${formattedDate}</span>
                        </div>
                    </div>
                `;
                
                // إضافة تأثير النقر لفتح الخبر
                card.addEventListener("click", () => {
                    // حفظ الخبر في localStorage ونقله لصفحة article.html
                    localStorage.setItem('currentArticle', JSON.stringify({
                        title: article.title,
                        description: article.description,
                        image: imageUrl,
                        source: article.source.name,
                        publishedAt: formattedDate,
                        content: article.content || article.description,
                        url: article.url
                    }));
                    window.location.href = 'article.html';
                });
                
                container.appendChild(card);
                
                // تأثير الظهور التدريجي
                setTimeout(() => {
                    card.classList.add("visible");
                }, index * 150);
            });
        }
        
        // تحديث تلقائي كل 5 دقائق
        function startAutoRefresh() {
            setInterval(() => {
                const currentTopic = document.getElementById("league").value;
                fetchNews(currentTopic);
            }, 300000); // 5 دقائق
        }
        
        // تهيئة الصفحة
        document.addEventListener("DOMContentLoaded", function() {
            fetchNews();
            
            // إضافة مستمع لتغيير الدوري
            document.getElementById("league").addEventListener("change", (e) => {
                fetchNews(e.target.value);
            });
            
            // بدء التحديث التلقائي
            startAutoRefresh();
            
            // تحديث عنوان الصفحة لإظهار الدوري المختار
            document.getElementById("league").addEventListener("change", function() {
                const selectedOption = this.options[this.selectedIndex].text;
                document.title = `أخبار ${selectedOption} - موقع أخبار الكرة`;
            });
        });
    </script>
</body>
</html>
