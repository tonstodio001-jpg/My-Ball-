<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المباريات الحية - موقع أخبار الكرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff6a;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
            --header-bg: #1e1e1e;
            --text-light: #ccc;
            --error-color: #ff4444;
            --live-color: #ff4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            line-height: 1.6;
        }
        
        header {
            background: var(--header-bg);
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0, 255, 106, 0.25);
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            font-size: 1.5em;
            color: var(--primary-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        .nav-link:hover {
            background: rgba(0, 255, 106, 0.1);
        }
        
        .nav-link.active {
            background: var(--primary-color);
            color: black;
            font-weight: bold;
        }
        
        .page-header {
            text-align: center;
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .page-title {
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .live-indicator {
            background: var(--live-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.6em;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .page-subtitle {
            color: var(--text-light);
            font-size: 1.1em;
        }
        
        .matches-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        
        .league-section {
            margin-bottom: 30px;
        }
        
        .league-header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .league-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        
        .league-name {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .match-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }
        
        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 106, 0.2);
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .match-status {
            background: var(--live-color);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .match-time {
            color: var(--text-light);
            font-size: 0.9em;
        }
        
        .match-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .team-home {
            justify-content: flex-end;
        }
        
        .team-away {
            justify-content: flex-start;
        }
        
        .team-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        
        .team-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .match-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
        }
        
        .score {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        
        .match-minute {
            background: #333;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        
        .match-events {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        
        .events-title {
            color: var(--text-light);
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .event-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: var(--text-light);
        }
        
        .event-time {
            background: #333;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--primary-color);
            font-size: 1.2em;
        }
        
        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .error-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--error-color);
        }
        
        .no-matches {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 1.1em;
        }
        
        .refresh-info {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #888;
            border-top: 1px solid #222;
            margin-top: 50px;
            font-size: 0.9em;
        }
        
        /* تحسينات للجوال */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                gap: 10px;
            }
            
            .page-title {
                font-size: 2em;
                flex-direction: column;
                gap: 10px;
            }
            
            .match-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .team {
                justify-content: center !important;
            }
            
            .match-score {
                margin: 10px 0;
                flex-direction: row;
                gap: 10px;
            }
            
            .score {
                margin-bottom: 0;
            }
        }
        
        @media (max-width: 480px) {
            .page-title {
                font-size: 1.6em;
            }
            
            .team-name {
                font-size: 1em;
            }
            
            .score {
                font-size: 1.6em;
            }
            
            .nav-link {
                padding: 6px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">📰 أخبار كرة القدم</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">🏠 الأخبار</a>
                <a href="live-matches.html" class="nav-link active">🔴 المباريات</a>
                <a href="article.html" class="nav-link">📄 المقالات</a>
            </div>
        </div>
    </header>

    <div class="page-header">
        <h1 class="page-title">
            المباريات الحية
            <span class="live-indicator">🔴 مباشر</span>
        </h1>
        <p class="page-subtitle">تابع أحدث المباريات والأهداف لحظة بلحظة</p>
    </div>

    <div class="matches-container">
        <div id="matches-content">
            <div class="loading">جارٍ تحميل المباريات الحية</div>
        </div>
        <div class="refresh-info">سيتم تحديث النتائج تلقائياً كل 60 ثانية</div>
    </div>

    <footer>
        © 2025 موقع أخبار الكرة - جميع الحقوق محفوظة ⚽
    </footer>

    <script>
        // بيانات تجريبية للمباريات (للاستخدام عند فشل API)
        const mockMatches = [
            {
                league: {
                    name: "الدوري الإنجليزي الممتاز",
                    logo: "https://media.api-sports.io/football/leagues/39.png"
                },
                teams: {
                    home: {
                        name: "مانشستر سيتي",
                        logo: "https://media.api-sports.io/football/teams/50.png"
                    },
                    away: {
                        name: "أرسنال",
                        logo: "https://media.api-sports.io/football/teams/42.png"
                    }
                },
                goals: { home: 2, away: 1 },
                fixture: {
                    status: { elapsed: 67, long: "مباشر" }
                },
                events: [
                    { time: { elapsed: 23 }, type: "Goal", team: { name: "مانشستر سيتي" } },
                    { time: { elapsed: 45 }, type: "Goal", team: { name: "أرسنال" } },
                    { time: { elapsed: 58 }, type: "Goal", team: { name: "مانشستر سيتي" } }
                ]
            },
            {
                league: {
                    name: "الدوري الإسباني",
                    logo: "https://media.api-sports.io/football/leagues/140.png"
                },
                teams: {
                    home: {
                        name: "ريال مدريد",
                        logo: "https://media.api-sports.io/football/teams/541.png"
                    },
                    away: {
                        name: "برشلونة",
                        logo: "https://media.api-sports.io/football/teams/529.png"
                    }
                },
                goals: { home: 1, away: 1 },
                fixture: {
                    status: { elapsed: 42, long: "مباشر" }
                },
                events: [
                    { time: { elapsed: 15 }, type: "Goal", team: { name: "ريال مدريد" } },
                    { time: { elapsed: 33 }, type: "Goal", team: { name: "برشلونة" } }
                ]
            }
        ];

        async function fetchLiveMatches() {
            const container = document.getElementById("matches-content");
            
            try {
                // استخدام API-Sports (يحتاج لمفتاح API حقيقي)
                const apiKey = "f9aed5a8e7c19f486da7b98a7229716b";
                const response = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
                    method: "GET",
                    headers: { "x-apisports-key": apiKey }
                });
                
                if (!response.ok) {
                    throw new Error(`خطأ في الشبكة: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.response && data.response.length > 0) {
                    displayMatches(data.response);
                } else {
                    // إذا لم توجد مباريات حية، استخدم البيانات التجريبية
                    console.warn('لا توجد مباريات حية، استخدام البيانات التجريبية');
                    displayMatches(mockMatches);
                }
                
            } catch (error) {
                console.error('تفاصيل الخطأ:', error);
                // في حالة الخطأ، استخدم البيانات التجريبية
                displayMatches(mockMatches);
                
                container.innerHTML += `
                    <div class="error-message">
                        <p>⚠️ تم تحميل بيانات تجريبية بسبب مشكلة في الاتصال</p>
                        <button class="retry-btn" onclick="fetchLiveMatches()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function displayMatches(matches) {
            const container = document.getElementById("matches-content");
            
            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <h3>⚽ لا توجد مباريات حية الآن</h3>
                        <p>لا توجد مباريات مباشرة في الوقت الحالي. يرجى العودة لاحقاً.</p>
                    </div>
                `;
                return;
            }
            
            // تجميع المباريات حسب البطولة
            const matchesByLeague = {};
            matches.forEach(match => {
                const leagueName = match.league?.name || "بطولة غير معروفة";
                if (!matchesByLeague[leagueName]) {
                    matchesByLeague[leagueName] = [];
                }
                matchesByLeague[leagueName].push(match);
            });
            
            container.innerHTML = "";
            
            // عرض المباريات مجمعة حسب البطولة
            Object.entries(matchesByLeague).forEach(([leagueName, leagueMatches]) => {
                const leagueSection = document.createElement("div");
                leagueSection.className = "league-section";
                
                leagueSection.innerHTML = `
                    <div class="league-header">
                        <img src="${leagueMatches[0].league?.logo || ''}" alt="${leagueName}" class="league-logo" 
                             onerror="this.style.display='none'">
                        <div class="league-name">${leagueName}</div>
                    </div>
                `;
                
                leagueMatches.forEach(match => {
                    const matchCard = document.createElement("div");
                    matchCard.className = "match-card";
                    
                    // تجهيز الأحداث (الأهداف)
                    const events = match.events?.filter(event => event.type === "Goal") || [];
                    
                    matchCard.innerHTML = `
                        <div class="match-header">
                            <div class="match-status">${match.fixture.status.long || 'مباشر'}</div>
                            <div class="match-time">الدقيقة ${match.fixture.status.elapsed || '0'}</div>
                        </div>
                        
                        <div class="match-content">
                            <div class="team team-home">
                                <span class="team-name">${match.teams.home.name}</span>
                                <img src="${match.teams.home.logo}" alt="${match.teams.home.name}" class="team-logo"
                                     onerror="this.src='https://via.placeholder.com/60x60/333/fff?text=⚽'">
                            </div>
                            
                            <div class="match-score">
                                <div class="score">${match.goals.home} - ${match.goals.away}</div>
                                <div class="match-minute">${match.fixture.status.elapsed || '0'}'</div>
                            </div>
                            
                            <div class="team team-away">
                                <img src="${match.teams.away.logo}" alt="${match.teams.away.name}" class="team-logo"
                                     onerror="this.src='https://via.placeholder.com/60x60/333/fff?text=⚽'">
                                <span class="team-name">${match.teams.away.name}</span>
                            </div>
                        </div>
                        
                        ${events.length > 0 ? `
                            <div class="match-events">
                                <div class="events-title">الأهداف:</div>
                                <div class="event-list">
                                    ${events.map(event => `
                                        <div class="event-item">
                                            <span class="event-time">${event.time.elapsed}'</span>
                                            <span>⚽ هدف لـ ${event.team.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    `;
                    
                    leagueSection.appendChild(matchCard);
                });
                
                container.appendChild(leagueSection);
            });
        }
        
        // تحديث المباريات كل 60 ثانية
        function startAutoRefresh() {
            setInterval(fetchLiveMatches, 60000);
        }
        
        // تهيئة الصفحة
        document.addEventListener("DOMContentLoaded", function() {
            fetchLiveMatches();
            startAutoRefresh();
        });
    </script>
</body>
</html>
